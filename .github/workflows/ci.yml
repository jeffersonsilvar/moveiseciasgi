name: SGI Commerce OS - validação de build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências (usar npm ci após versionar package-lock.json)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund
          fi
      - name: TypeScript e compilação
        run: npm run build
      - name: Verificação de dependências
        run: npm audit --audit-level=high
